services:
  - type: web
    name: mihenk
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /ready
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 30
    envVars:
      - key: APP_ENVIRONMENT
        value: production
      - key: DATA_BACKEND
        value: supabase
      - key: COOKIE_SECURE
        value: "true"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: ALLOW_REGISTRATION
        value: "false"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: APP_DOMAIN
        value: mihenk.onrender.com
      - key: RECOVERY_REDIRECT_URL
        value: https://mihenk.onrender.com/
      - key: ALLOWED_ORIGINS
        value: https://mihenk.onrender.com
      - key: REDIS_KEY_PREFIX
        value: mihenk:production
      - key: REMINDER_PROVIDER
        value: multi
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_STARTTLS
        value: "true"
      - key: LLM_ENABLED
        value: "false"
      - key: AI_PROVIDER
        value: none
      - key: SEMANTIC_SEARCH_BACKEND
        value: pgvector
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: PIPELINE_WEBHOOK_SECRET
        generateValue: true
      - key: LEGAL_ENTITY_NAME
        sync: false
      - key: PRIVACY_CONTACT_EMAIL
        sync: false
      - key: SECRETS_ROTATED_AT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: WEB_PUSH_VAPID_PUBLIC_KEY
        sync: false
      - key: WEB_PUSH_VAPID_PRIVATE_KEY
        sync: false
      - key: WEB_PUSH_VAPID_SUBJECT
        sync: false

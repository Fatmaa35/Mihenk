services:
  - type: keyvalue
    name: mihenk-cache-production
    plan: free
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
    persistenceMode: "off"

  - type: web
    name: mihenk-web-production
    runtime: docker
    plan: free
    region: frankfurt
    repo: https://github.com/Fatmaa35/Mihenk
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /ready
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENVIRONMENT
        value: production
      - key: DATA_BACKEND
        value: supabase
      - key: COOKIE_SECURE
        value: "true"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: ALLOW_REGISTRATION
        value: "false"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: APP_DOMAIN
        fromService:
          type: web
          name: mihenk-web-production
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: mihenk-cache-production
          property: connectionString
      - key: REDIS_KEY_PREFIX
        value: mihenk:production
      - key: REMINDER_PROVIDER
        value: smtp
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_STARTTLS
        value: "true"
      - key: LLM_ENABLED
        value: "false"
      - key: AI_PROVIDER
        value: none
      - key: SEMANTIC_SEARCH_BACKEND
        value: pgvector
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: PIPELINE_WEBHOOK_SECRET
        generateValue: true
      - key: LEGAL_ENTITY_NAME
        value: Mihenk
      - key: PRIVACY_CONTACT_EMAIL
        sync: false
      - key: SECRETS_ROTATED_AT
        value: "2026-09-04"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false

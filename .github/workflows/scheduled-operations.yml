name: scheduled-production-operations

on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "10 1 * * *"
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        required: true
        options: [reminders, retention]

permissions:
  contents: read

jobs:
  reminders:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'reminders' || github.event_name == 'schedule' && github.event.schedule == '*/15 * * * *'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env: &production-env
      APP_ENVIRONMENT: production
      DATA_BACKEND: supabase
      COOKIE_SECURE: "true"
      RATE_LIMIT_ENABLED: "true"
      ALLOW_REGISTRATION: "false"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_JWKS_URL: ${{ secrets.SUPABASE_JWKS_URL }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      PIPELINE_WEBHOOK_SECRET: ${{ secrets.PIPELINE_WEBHOOK_SECRET }}
      RECOVERY_REDIRECT_URL: ${{ vars.RECOVERY_REDIRECT_URL }}
      ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
      APP_DOMAIN: ${{ vars.APP_DOMAIN }}
      LEGAL_ENTITY_NAME: ${{ vars.LEGAL_ENTITY_NAME }}
      PRIVACY_CONTACT_EMAIL: ${{ vars.PRIVACY_CONTACT_EMAIL }}
      REMINDER_PROVIDER: smtp
      SMTP_HOST: smtp-relay.brevo.com
      SMTP_PORT: "587"
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM_EMAIL: ${{ vars.SMTP_FROM_EMAIL }}
      SMTP_STARTTLS: "true"
      WEB_PUSH_VAPID_PUBLIC_KEY: ${{ secrets.WEB_PUSH_VAPID_PUBLIC_KEY }}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${{ secrets.WEB_PUSH_VAPID_PRIVATE_KEY }}
      WEB_PUSH_VAPID_SUBJECT: ${{ vars.WEB_PUSH_VAPID_SUBJECT }}
      LLM_ENABLED: "false"
      AI_PROVIDER: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m scripts.process_reading_reminders

  retention:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'retention' || github.event_name == 'schedule' && github.event.schedule == '10 1 * * *'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env: *production-env
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m scripts.enforce_data_retention

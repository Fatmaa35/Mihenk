name: quality
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATA_BACKEND: sqlite
      LLM_ENABLED: "false"
      AI_PROVIDER: none
      RATE_LIMIT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
      - name: Run Python tests
        run: python -m pytest -q
      - name: Validate production release controls
        run: python -m scripts.production_readiness --repository-only
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Run frontend tests
        run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start test server
        run: python -m uvicorn app.main:app --host 127.0.0.1 --port 8010 &
      - name: Wait for test server
        run: curl --retry 30 --retry-delay 1 --retry-connrefused --fail --silent http://127.0.0.1:8010/ready
      - name: Run desktop and mobile browser smoke tests
        run: npm run test:e2e
        working-directory: frontend
      - run: python -m compileall -q app scripts
      - name: Dependency vulnerability audit
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements.lock.txt
      - name: Frontend dependency audit
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
  migration-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
      - run: python -c "from pathlib import Path; from app.database import Repository; Repository(Path('/tmp/migration-smoke.db'))"
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: mihenk:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: quality
on:
  pull_request:
  push:
    branches: [main]
defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATA_BACKEND: sqlite
      LLM_ENABLED: "false"
      AI_PROVIDER: none
      RATE_LIMIT_ENABLED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
      - name: Run Python tests
        run: python -m pytest -q
      - name: Validate production release controls
        run: python -m scripts.production_readiness --repository-only
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Run frontend tests
        run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start test server
        run: python -m uvicorn app.main:app --host 127.0.0.1 --port 8010 &
      - name: Wait for test server
        run: curl --retry 30 --retry-delay 1 --retry-connrefused --fail --silent http://127.0.0.1:8010/ready
      - name: Run desktop and mobile browser smoke tests
        run: npm run test:e2e
        working-directory: frontend
      - run: python -m compileall -q app scripts
      - name: Dependency vulnerability audit
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements.lock.txt
      - name: Frontend dependency audit
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
  migration-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
      - run: python -c "from pathlib import Path; from app.database import Repository; Repository(Path('/tmp/migration-smoke.db'))"
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: mihenk:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

# Eski bağımlılıkları yeniden denetleyen tek mekanizma bu: güvenlik uyarıları
# ve yama önerileri haftalık olarak PR'a dönüşür. Eylemler artık commit
# karmasıyla sabitlendiği için karmaları da buradan güncellenir.
version: 2
updates:

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      guvenli-guncellemeler:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      guvenli-guncellemeler:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      guvenli-guncellemeler:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      guvenli-guncellemeler:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      guvenli-guncellemeler:
        patterns: ["*"]
        update-types: ["minor", "patch"]
